<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ORBIT PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#130b24;color:#fff;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#160d2b;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.score-lbl{font-size:11px;color:#a78bfa;letter-spacing:1px}
.score-val{font-size:28px;font-weight:900;color:#fff}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:16px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(19,11,36,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:20}
.hd{display:none!important}
.logo{font-size:32px;font-weight:900;color:#a3e635;text-shadow:0 0 20px rgba(163,230,53,.4);margin-bottom:6px}
.sub{font-size:12px;color:#cbd5e1;margin-bottom:16px;text-align:center}
.card{width:100%;max-width:350px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:bold;color:#fbbf24;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:190px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;padding:7px 8px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.04);font-size:13px}
.lb-row.me{background:rgba(163,230,53,.18);border:1px solid #a3e635}
.btn{width:100%;max-width:350px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:10px}
.btn-play{background:linear-gradient(135deg,#84cc16,#10b981);color:#090614}
.btn-share{background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;text-align:center}
#toast{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#a3e635;color:#000;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:bold;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div><div class="score-lbl">BEST</div><div class="score-val" id="hud-best" style="font-size:18px;color:#a3e635">0</div></div>
<div style="text-align:center"><div class="score-lbl">SCORE</div><div class="score-val" id="hud-score">0</div></div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" onclick="openMenu()">🏆</button>
</div>
</div>
<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">🛸 ORBIT PRO</div>
<div class="sub">با ضربه روی صفحه جهت سفینه را عوض کن، الماس‌ها را بگیر و از گوی‌های آتشین فرار کن!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#fff;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#f43f5e">GAME OVER</div>
<div class="sub" id="over-msg">برخورد با گوی آتشین!</div>
<div class="stats">
<div class="stat"><div style="font-size:22px;font-weight:900;color:#a3e635" id="end-score">0</div><div style="font-size:11px;color:#94a3b8">امتیاز</div></div>
<div class="stat"><div style="font-size:22px;font-weight:900;color:#fbbf24" id="end-best">0</div><div style="font-size:11px;color:#94a3b8">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/orbit_lb.json";
let usr={id:localStorage.getItem("orb_uid")||("u_"+Math.floor(1e5+Math.random()*9e5)),name:"بازیکن مهمان"};
localStorage.setItem("orb_uid",usr.id);
try{
const raw=(location.hash||"")+"&"+(location.search||"");
const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
if(m&&m[1]){const u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله"}}
if(window.Bale&&Bale.WebApp){Bale.WebApp.ready();Bale.WebApp.expand();const u=Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user;if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله"}}
}catch(e){}

let best=parseInt(localStorage.getItem("orb_best")||"0",10),lb=[];
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2200)}

async function syncLB(sc){
try{
const r=await fetch(DB);let d=await r.json();if(!Array.isArray(d))d=[];
const i=d.findIndex(x=>x.id===usr.id);
if(i>-1){if(sc>d[i].score)d[i].score=sc;if(usr.name!=="بازیکن مهمان")d[i].name=usr.name;if(d[i].score>best){best=d[i].score;localStorage.setItem("orb_best",best)}}
else if(sc>0){d.push({id:usr.id,name:usr.name,score:sc})}
d.sort((a,b)=>b.score-a.score);d=d.slice(0,25);lb=d;
if(sc>0)await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><span>${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)} ${p.name}</span><strong style="color:#a3e635">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#94a3b8;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null;
function beep(f,d,t="sine"){if(!snd)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.11,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toggleSound(){snd=!snd;document.getElementById("btn-snd").innerText=snd?"🔊":"🔇"}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=360,H=640,CX=180,CY=330,R=125;
let bgDots=[],craters=[];
function resize(){
const dpr=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth>480?480:window.innerWidth;H=window.innerHeight;
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
CX=W/2;CY=H/2+20;R=Math.min(W,H)*0.35;
bgDots=[];
for(let x=15;x<W;x+=36)for(let y=15;y<H;y+=36)bgDots.push({x,y,r:Math.random()*3+2});
craters=[{dx:-R*0.35,dy:-R*0.2,r:14},{dx:R*0.3,dy:R*0.25,r:18},{dx:-R*0.2,dy:R*0.38,r:10},{dx:R*0.42,dy:-R*0.18,r:11}];
}
window.addEventListener("resize",resize);resize();

let st="menu",score=0,ang=-1.57,dir=1,spd=0.032,gems=[],buls=[],parts=[],tmr=0,pulse=0;
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function mkGems(){
gems=[];const cnt=20;
for(let i=0;i<cnt;i++){
const a=(Math.PI*2/cnt)*i;
if(Math.abs(norm(a-ang))>0.28)gems.push({a,ok:false});
}
}
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*3.5+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
score=0;ang=-1.57;dir=1;spd=0.032;buls=[];parts=[];tmr=25;
document.getElementById("hud-score").innerText="0";mkGems();st="play";beep(520,.1);
}
function openMenu(){st="menu";document.getElementById("over-screen").classList.add("hd");document.getElementById("start-screen").classList.remove("hd");syncLB(0)}

document.getElementById("wrap").addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||st!=="play")return;
dir*=-1;pulse=1;beep(dir===1?460:370,.07);
boom(CX+Math.cos(ang)*R,CY+Math.sin(ang)*R,"#a3e635",6);
});

function over(){
st="over";beep(150,.32,"sawtooth");boom(CX+Math.cos(ang)*R,CY+Math.sin(ang)*R,"#f43f5e",28);
if(score>best){best=score;localStorage.setItem("orb_best",best)}
document.getElementById("end-score").innerText=score;document.getElementById("end-best").innerText=best;
setTimeout(()=>{document.getElementById("over-screen").classList.remove("hd");syncLB(score)},400);
}

function drawShip(x,y,a,d){
ctx.save();
ctx.translate(x,y);
// زاویه مماس دقیق با دایره مدار در جهت حرکت
ctx.rotate(a+(d===1?Math.PI/2:-Math.PI/2));
// شعله موتور پشت سفینه
ctx.fillStyle="#fbbf24";
ctx.beginPath();ctx.moveTo(-4,11);ctx.lineTo(0,17+Math.random()*4);ctx.lineTo(4,11);ctx.closePath();ctx.fill();
// بدنه سفینه سبک GAMEE
ctx.fillStyle="#f8fafc";ctx.strokeStyle="#0f172a";ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(0,-14);
ctx.quadraticCurveTo(10,-4,8,11);
ctx.lineTo(0,8);
ctx.lineTo(-8,11);
ctx.quadraticCurveTo(-10,-4,0,-14);
ctx.closePath();ctx.fill();ctx.stroke();
// باله‌های سبز نئونی
ctx.fillStyle="#84cc16";
ctx.beginPath();ctx.moveTo(-8,3);ctx.lineTo(-12,11);ctx.lineTo(-7,10);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(8,3);ctx.lineTo(12,11);ctx.lineTo(7,10);ctx.closePath();ctx.fill();
// شیشه کابین سفینه
ctx.fillStyle="#365314";
ctx.beginPath();ctx.ellipse(0,-1,3.5,5,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#bef264";
ctx.beginPath();ctx.ellipse(-1,-2,1.2,2.2,0,0,Math.PI*2);ctx.fill();
ctx.restore();
}

function loop(){
pulse*=0.9;
ctx.clearRect(0,0,W,H);

// خال‌های پس‌زمینه بنفش تیره مشابه نسخه تلگرام
ctx.fillStyle="rgba(255,255,255,0.03)";
bgDots.forEach(d=>{ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill()});

if(st==="play"){
ang+=spd*dir;
const sx=CX+Math.cos(ang)*R,sy=CY+Math.sin(ang)*R;
let rem=0;
gems.forEach(g=>{
if(!g.ok){
rem++;
if(Math.abs(norm(g.a-ang))<0.12){
g.ok=true;score++;
document.getElementById("hud-score").innerText=score;
if(score>best)document.getElementById("hud-best").innerText=score;
spd=Math.min(0.056,0.032+score*0.00028);
boom(CX+Math.cos(g.a)*R,CY+Math.sin(g.a)*R,"#fff",8);
beep(660+(score%10)*35,.07);
}
}
});
if(rem===0){mkGems();beep(900,.16)}

// شلیک پرتابه‌های سریع و هیجانی از سیاره مرکزی
tmr++;
const spawnRate=Math.max(26,58-Math.floor(score*0.6));
if(tmr>=spawnRate){
tmr=0;
const bSpd=Math.min(5.8,3.1+score*0.035);
const targetA=ang+(Math.random()*1.1-0.2)*dir;
buls.push({a:targetA,d:34,s:bSpd});
// از امتیاز 15 به بعد گاهی دو توپ هم‌زمان پرتاب می‌شود
if(score>=15&&Math.random()<0.45){
buls.push({a:targetA+(Math.random()>0.5?0.75:-0.75),d:34,s:bSpd*0.92});
}
pulse=0.9;
}

for(let i=buls.length-1;i>=0;i--){
const b=buls[i];b.d+=b.s;
const bx=CX+Math.cos(b.a)*b.d,by=CY+Math.sin(b.a)*b.d;
if(Math.hypot(bx-sx,by-sy)<15){over();break}
if(b.d>Math.max(W,H)*0.75)buls.splice(i,1);
}
}

// سیاره بزرگ بنفش داخل مدار (دقیقاً مشابه اسکرین‌شات تلگرام)
ctx.fillStyle="#28164a";ctx.beginPath();ctx.arc(CX,CY,R*0.68,0,6.28);ctx.fill();
ctx.fillStyle="#21113d";
craters.forEach(c=>{ctx.beginPath();ctx.arc(CX+c.dx,CY+c.dy,c.r,0,6.28);ctx.fill()});

// حلقه مدار طلایی/کرم
ctx.strokeStyle="#d6c596";ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,R,0,6.28);ctx.stroke();

// حلقه‌های مرکزی سیاره (بنفش، صورتی، سبز، زرد)
const p=pulse*4;
ctx.fillStyle="#9333ea";ctx.beginPath();ctx.arc(CX,CY,36+p,0,6.28);ctx.fill();
ctx.fillStyle="#d946ef";ctx.beginPath();ctx.arc(CX,CY,26+p*0.7,0,6.28);ctx.fill();
ctx.fillStyle="#84cc16";ctx.beginPath();ctx.arc(CX,CY,15+p*0.4,0,6.28);ctx.fill();
ctx.fillStyle="#1e1b4b";ctx.beginPath();ctx.arc(CX,CY,7,0,6.28);ctx.fill();

// الماس‌های لوزی سفید روی مدار
gems.forEach(g=>{
if(!g.ok){
const gx=CX+Math.cos(g.a)*R,gy=CY+Math.sin(g.a)*R;
ctx.save();ctx.translate(gx,gy);ctx.rotate(g.a+Math.PI/4);
ctx.fillStyle="#ffffff";ctx.fillRect(-3.8,-3.8,7.6,7.6);
ctx.restore();
}
});

// گوی‌های آتشین دنباله‌دار
buls.forEach(b=>{
const bx=CX+Math.cos(b.a)*b.d,by=CY+Math.sin(b.a)*b.d;
// دنباله گوی
const tx=CX+Math.cos(b.a)*Math.max(20,b.d-24),ty=CY+Math.sin(b.a)*Math.max(20,b.d-24);
const grd=ctx.createLinearGradient(tx,ty,bx,by);
grd.addColorStop(0,"rgba(250,204,21,0)");grd.addColorStop(1,"rgba(250,204,21,0.55)");
ctx.strokeStyle=grd;ctx.lineWidth=11;ctx.lineCap="round";
ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx,by);ctx.stroke();
// سر گوی
ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(bx,by,6.5,0,6.28);ctx.fill();
ctx.fillStyle="#fef9c3";ctx.beginPath();ctx.arc(bx,by,3,0,6.28);ctx.fill();
});

// سفینه بازیکن
if(st!=="over"){
drawShip(CX+Math.cos(ang)*R,CY+Math.sin(ang)*R,ang,dir);
}

// ذرات انفجار
parts.forEach((pt,i)=>{
pt.x+=pt.vx;pt.y+=pt.vy;pt.l-=0.04;
ctx.fillStyle=pt.c;ctx.globalAlpha=Math.max(0,pt.l);
ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,6.28);ctx.fill();
if(pt.l<=0)parts.splice(i,1);
});
ctx.globalAlpha=1;
requestAnimationFrame(loop);
}
syncLB(0);loop();
function shareScore(){const t=`🛸 رکورد من در بازی ORBIT PRO شد: ${best} امتیاز!\nمی‌تونی رکوردم رو بزنی؟ 👇`;if(navigator.clipboard)navigator.clipboard.writeText(t);toast("متن کل‌کل کپی شد!")}
</script>
</body>
</html>
