<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ORBIT PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#130b24;color:#fff;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#160d2b;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;height:52px;background:rgba(12,7,24,.8);padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.hud-left{font-size:14px;color:#fbbf24;font-weight:bold;pointer-events:auto;cursor:pointer}
.score-val{font-size:22px;font-weight:900}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:14px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(19,11,36,.94);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:20}
.hd{display:none!important}
.logo{font-size:30px;font-weight:900;color:#a3e635;margin-bottom:6px}
.sub{font-size:12px;color:#cbd5e1;margin-bottom:14px;text-align:center}
.card{width:100%;max-width:350px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:bold;color:#fbbf24;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:195px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.04);font-size:13px}
.lb-row.me{background:rgba(163,230,53,.18);border:1px solid #a3e635}
.lb-user{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.av{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.av img{width:100%;height:100%;object-fit:cover}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.btn{width:100%;max-width:350px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:10px}
.btn-play{background:linear-gradient(135deg,#84cc16,#10b981);color:#090614}
.btn-share{background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:12px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;text-align:center}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#a3e635;color:#000;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:bold;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div class="hud-left" onclick="openMenu()">🏆 <span id="hud-best">0</span></div>
<div class="score-val" id="hud-score">0</div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</button>
</div>
</div>
<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">🛸 ORBIT PRO</div>
<div class="sub">با ضربه روی صفحه جهت سفینه را عوض کن و از گوی‌های رنگی فرار کن!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#fff;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
</div>

<div class="overlay hd" id="pause-screen">
<div class="logo" style="color:#38bdf8">توقف بازی</div>
<button class="btn btn-play" onclick="togglePause()">▶️ ادامه بازی</button>
<button class="btn btn-share" onclick="openMenu()">🏠 منو و رده‌بندی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#f43f5e">GAME OVER</div>
<div class="stats">
<div class="stat"><div style="font-size:22px;font-weight:900;color:#a3e635" id="end-score">0</div><div style="font-size:11px;color:#94a3b8">امتیاز</div></div>
<div class="stat"><div style="font-size:22px;font-weight:900;color:#fbbf24" id="end-best">0</div><div style="font-size:11px;color:#94a3b8">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/orbit_lb.json";
const BOT_LINK="https://ble.ir/orbit_pro_game_bot";
const CHANNEL_ID="@gamee_balee";

let usr={id:localStorage.getItem("orb_uid")||("u_"+Math.floor(1e5+Math.random()*9e5)),name:"بازیکن مهمان",photo:""};
localStorage.setItem("orb_uid",usr.id);
try{
const raw=(location.hash||"")+"&"+(location.search||"");
const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
if(m&&m[1]){const u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
if(window.Bale&&Bale.WebApp){Bale.WebApp.ready();Bale.WebApp.expand();const u=Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user;if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
}catch(e){}

const GRADS=["linear-gradient(135deg,#06b6d4,#3b82f6)","linear-gradient(135deg,#ec4899,#8b5cf6)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#10b981,#059669)","linear-gradient(135deg,#6366f1,#a855f7)"];
function avHtml(p){
let s=0;for(let i=0;i<p.id.length;i++)s+=p.id.charCodeAt(i);
const bg=GRADS[s%GRADS.length],ch=(p.name||"؟").trim().charAt(0);
return p.photo?`<div class="av" style="background:${bg}"><img src="${p.photo}" onerror="this.parentNode.innerText='${ch}'"></div>`:`<div class="av" style="background:${bg}">${ch}</div>`;
}

let best=parseInt(localStorage.getItem("orb_best")||"0",10),lb=[];
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2200)}

async function syncLB(sc){
try{
const r=await fetch(DB);let d=await r.json();if(!Array.isArray(d))d=[];
const i=d.findIndex(x=>x.id===usr.id);
if(i>-1){if(sc>d[i].score)d[i].score=sc;if(usr.name!=="بازیکن مهمان")d[i].name=usr.name;if(usr.photo)d[i].photo=usr.photo;if(d[i].score>best){best=d[i].score;localStorage.setItem("orb_best",best)}}
else if(sc>0){d.push({id:usr.id,name:usr.name,photo:usr.photo,score:sc})}
d.sort((a,b)=>b.score-a.score);d=d.slice(0,25);lb=d;
if(sc>0)await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><div class="lb-user"><span style="width:22px;font-weight:900">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)}</span>${avHtml(p)}<span class="lb-name">${p.name}</span></div><strong style="color:#a3e635;margin-right:6px">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#94a3b8;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null;
function beep(f,d,t="sine"){if(!snd)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.11,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toggleSound(){snd=!snd;document.getElementById("btn-snd").innerText=snd?"🔊":"🔇"}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=360,H=640,CX=180,CY=330,R=125;
function resize(){
W=window.innerWidth>480?480:window.innerWidth;H=window.innerHeight;
cv.width=W;cv.height=H;CX=W/2;CY=H/2+24;R=Math.min(W,H)*0.36;
}
window.addEventListener("resize",resize);resize();

const COLS=["#38bdf8","#e879f9","#f97316","#facc15","#4ade80"];
let st="menu",score=0,ang=-1.57,dir=1,gems=[],buls=[],parts=[],tmr=0,pulse=0,flash=0;
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function mkGems(){gems=[];for(let i=0;i<28;i++){const a=(Math.PI*2/28)*i;if(Math.abs(norm(a-ang))>0.22)gems.push({a,ok:false})}}
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*3.5+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
score=0;ang=-1.57;dir=1;buls=[];parts=[];tmr=10;flash=0.8;
document.getElementById("hud-score").innerText="0";mkGems();st="play";beep(560,.12);
}
function togglePause(){
if(st==="play"){st="pause";document.getElementById("pause-screen").classList.remove("hd")}
else if(st==="pause"){st="play";document.getElementById("pause-screen").classList.add("hd")}
}
function openMenu(){st="menu";document.getElementById("over-screen").classList.add("hd");document.getElementById("pause-screen").classList.add("hd");document.getElementById("start-screen").classList.remove("hd");syncLB(0)}

document.getElementById("wrap").addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||e.target.closest(".hud-left")||st!=="play")return;
dir*=-1;pulse=0.7;beep(dir===1?460:370,.06);
});

function over(){
st="over";beep(150,.32,"sawtooth");boom(CX+Math.cos(ang)*R,CY+Math.sin(ang)*R,"#f43f5e",28);
if(score>best){best=score;localStorage.setItem("orb_best",best)}
document.getElementById("end-score").innerText=score;document.getElementById("end-best").innerText=best;
setTimeout(()=>{document.getElementById("over-screen").classList.remove("hd");syncLB(score)},400);
}

function loop(){
pulse*=0.9;if(flash>0)flash=Math.max(0,flash-0.05);
ctx.clearRect(0,0,W,H);

if(st==="play"){
ang+=0.0235*dir;
const sx=CX+Math.cos(ang)*R,sy=CY+Math.sin(ang)*R;
let rem=0;
gems.forEach(g=>{if(!g.ok){rem++;if(Math.abs(norm(g.a-ang))<0.11){g.ok=true;score++;document.getElementById("hud-score").innerText=score;if(score>best)document.getElementById("hud-best").innerText=score;boom(CX+Math.cos(g.a)*R,CY+Math.sin(g.a)*R,"#fff",6);beep(650+(score%12)*30,.06)}}});
if(rem===0){flash=0.8;mkGems();beep(920,.16)}
tmr++;
if(tmr>=Math.max(20,42-Math.floor(score*0.32))){
tmr=0;
const bSpd=Math.min(6.4,2.25+score*0.032),tA=ang+(Math.random()*1.2-0.3)*dir;
buls.push({a:tA,d:28,s:bSpd,c:COLS[Math.floor(Math.random()*COLS.length)]});
if(score>=25&&Math.random()<0.38)buls.push({a:tA+(Math.random()>0.5?0.85:-0.85),d:28,s:bSpd*0.9,c:COLS[Math.floor(Math.random()*COLS.length)]});
pulse=0.85;
}
for(let i=buls.length-1;i>=0;i--){
const b=buls[i];b.d+=b.s;
const bx=CX+Math.cos(b.a)*b.d,by=CY+Math.sin(b.a)*b.d;
if(Math.hypot(bx-sx,by-sy)<14){over();break}
if(b.d>H*0.75)buls.splice(i,1);
}
}

ctx.fillStyle="#28164a";ctx.beginPath();ctx.arc(CX,CY,R*0.66,0,6.28);ctx.fill();
ctx.strokeStyle="#d6c596";ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(CX,CY,R,0,6.28);ctx.stroke();

const p=pulse*3.5;
ctx.fillStyle="#c2410c";ctx.beginPath();ctx.arc(CX,CY,35+p,0,6.28);ctx.fill();
ctx.fillStyle="#f97316";ctx.beginPath();ctx.arc(CX,CY,26+p*0.7,0,6.28);ctx.fill();
ctx.fillStyle="#84cc16";ctx.beginPath();ctx.arc(CX,CY,16+p*0.4,0,6.28);ctx.fill();
ctx.fillStyle="#1e1b4b";ctx.beginPath();ctx.arc(CX,CY,7.5,0,6.28);ctx.fill();

gems.forEach(g=>{if(!g.ok){const gx=CX+Math.cos(g.a)*R,gy=CY+Math.sin(g.a)*R;ctx.save();ctx.translate(gx,gy);ctx.rotate(g.a+0.785);ctx.fillStyle="#fff";ctx.fillRect(-3.4,-3.4,6.8,6.8);ctx.restore()}});
buls.forEach(b=>{const bx=CX+Math.cos(b.a)*b.d,by=CY+Math.sin(b.a)*b.d;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill()});

if(st!=="over"){
const sx=CX+Math.cos(ang)*R,sy=CY+Math.sin(ang)*R;
ctx.save();ctx.translate(sx,sy);ctx.rotate(ang+(dir===1?Math.PI:0));
ctx.fillStyle="#fff";ctx.strokeStyle="#0f172a";ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(10,7);ctx.quadraticCurveTo(0,11,-10,7);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle="#84cc16";ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5.5,4);ctx.lineTo(-5.5,4);ctx.closePath();ctx.fill();
ctx.restore();
}

parts.forEach((pt,i)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.l-=0.04;ctx.fillStyle=pt.c;ctx.globalAlpha=Math.max(0,pt.l);ctx.beginPath();ctx.arc(pt.x,pt.y,2.8,0,6.28);ctx.fill();if(pt.l<=0)parts.splice(i,1)});
ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
requestAnimationFrame(loop);
}
syncLB(0);loop();

function shareScore(){
const txt=`🛸 رکورد من در بازی ORBIT PRO شد: ${best} امتیاز!\nمی‌تونی رکوردم رو بزنی؟ 👇\n\n🎮 بازی‌های بیشتر و چالش‌های روزانه در کانال ما:\n${CHANNEL_ID} | https://ble.ir/gamee_balee`;
const shareUrl=`https://ble.ir/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(txt)}`;
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink){
Bale.WebApp.openLink(shareUrl);
}else if(navigator.share){
navigator.share({title:"ORBIT PRO",text:txt,url:BOT_LINK}).catch(()=>{});
}else{
window.open(shareUrl,"_blank");
}
}
</script>
</body>
</html>
